          "run": "python - <<'PYCODE'\nimport base64,gzip,hashlib,json,os,pathlib,re\nassert os.environ['GITHUB_REPOSITORY']=='sizhe233/oh-my-pi'\nassert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'\nassert os.environ['GITHUB_REF']=='refs/heads/main' and os.environ['GITHUB_REF_PROTECTED']=='true'\nassert os.environ['WORKFLOW_REF']=='sizhe233/oh-my-pi/.github/workflows/fork-v18.12.1-acceptance.yml@refs/heads/main'\nassert os.environ['TRUSTED_SHA']==os.environ['DISPATCH_SHA']\nassert re.fullmatch('[0-9a-f]{40}',os.environ['SOURCE_SHA'])\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'omp-trusted'\nroot.mkdir(exist_ok=True)\nfiles=json.loads(gzip.decompress(base64.b64decode((root/'bundle.base64').read_bytes())))\nfor name,raw in files.items():\n assert not name.startswith('/') and all(x not in ('','..','.') for x in name.split('/'))\n p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(raw.encode('utf-8'))\n(root/'trusted-harness-manifest.json').write_bytes(base64.b64decode(''))\n(root/'context.json').write_text(json.dumps({k:os.environ[k] for k in ['SOURCE_SHA','TRUSTED_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT']}))\n(root/'bundle.base64').unlink()\n\nPYCODE"
