{
  "name": "Fork fixed v18.12.2 Linux cold-start diagnostic",
  "on": {
    "push": {
      "branches": [
        "diagnostic/fork-linux-v18.12.2-254a5b34fa36f31795c8529249275372b86713c5"
      ],
      "paths": [
        ".github/workflows/fork-linux-browser-cold-diagnostic.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "fork-linux-cold-254a5b34fa36f31795c8529249275372b86713c5",
    "cancel-in-progress": false
  },
  "jobs": {
    "linux-cold": {
      "name": "Original cold browser command with bounded host observations",
      "if": "github.repository == 'sizhe233/oh-my-pi' && github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/fork-linux-v18.12.2-254a5b34fa36f31795c8529249275372b86713c5' && github.event.deleted == false",
      "runs-on": "ubuntu-22.04",
      "timeout-minutes": 180,
      "env": {
        "OMP_TEST_TIMEOUT": "120"
      },
      "steps": [
        {
          "uses": "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10",
          "with": {
            "ref": "254a5b34fa36f31795c8529249275372b86713c5",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify the trusted x64 source commit",
          "shell": "bash",
          "env": {
            "SOURCE_SHA": "254a5b34fa36f31795c8529249275372b86713c5"
          },
          "run": "set -euo pipefail\n[[ \"$SOURCE_SHA\" =~ ^[0-9a-f]{40}$ ]]\ntest \"$(git rev-parse HEAD)\" = \"$SOURCE_SHA\"\ntest \"$(uname -m)\" = x86_64\nbazelisk --version\nmkdir -p \"$RUNNER_TEMP/linux-cold-evidence\"\npython3 - \"$RUNNER_TEMP/linux-cold-evidence/source.json\" <<'PY'\nimport json,os,pathlib,subprocess,sys\nrecord={'sourceSha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'sourceTree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'workflowSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'diagnosticOnly':True,'actualAcceptancePassed':False}\npathlib.Path(sys.argv[1]).write_text(json.dumps(record,indent=2)+'\\n')\nPY\n"
        },
        {
          "name": "Stage fixed diagnostic manifest",
          "shell": "bash",
          "run": "python3 - <<'PY'\nimport json,os,pathlib\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'linux-cold-tools'\nroot.mkdir(exist_ok=False)\nmanifest={'collector.py': {'sha256': '457172188f68c539e080e68167e07af549a2a004b887293ec9f1417ee5cf3d2a', 'bytes': 16736}, 'original-browser-commands.sh': {'sha256': 'aaeba5cc7f09fbf6c4d58b10aa671100da6a3f8ab6794ccce1c34460517d0da4', 'bytes': 845}, 'run_cold_browser.sh': {'sha256': '51d6e459dd875b562e7168d20bc846b04621a45bc18131fb9d165c81b4455504', 'bytes': 2417}}\n(root/'manifest.json').write_text(json.dumps(manifest,sort_keys=True)+'\\n')\nPY\n"
        },
        {
          "name": "Stage collector.py part 1",
          "shell": "bash",
          "run": "python3 - <<'PY'\nimport os,pathlib\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'linux-cold-tools'\nwith (root/'collector.py.b64').open('a') as f: f.write('')\nPY\n"
        },
        {
          "name": "Stage collector.py part 2",
          "shell": "bash",
          "run": "python3 - <<'PY'\nimport os,pathlib\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'linux-cold-tools'\nwith (root/'collector.py.b64').open('a') as f: f.write('')\nPY\n"
        },
        {
          "name": "Stage collector.py part 3",
          "shell": "bash",
          "run": "python3 - <<'PY'\nimport os,pathlib\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'linux-cold-tools'\nwith (root/'collector.py.b64').open('a') as f: f.write('')\nPY\n"
        },
        {
          "name": "Stage original-browser-commands.sh part 1",
          "shell": "bash",
          "run": "python3 - <<'PY'\nimport os,pathlib\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'linux-cold-tools'\nwith (root/'original-browser-commands.sh.b64').open('a') as f: f.write('')\nPY\n"
        },
        {
          "name": "Stage run_cold_browser.sh part 1",
          "shell": "bash",
          "run": "python3 - <<'PY'\nimport os,pathlib\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'linux-cold-tools'\nwith (root/'run_cold_browser.sh.b64').open('a') as f: f.write('')\nPY\n"
        },
        {
          "name": "Verify fixed diagnostic module bytes",
          "shell": "bash",
          "run": "python3 - <<'PY'\nimport base64,hashlib,json,os,pathlib\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'linux-cold-tools'\nmanifest=json.loads((root/'manifest.json').read_text())\nfor name,identity in manifest.items():\n data=base64.b64decode((root/(name+'.b64')).read_text(),validate=True)\n assert len(data)==identity['bytes'] and hashlib.sha256(data).hexdigest()==identity['sha256']\n (root/name).write_bytes(data)\nevidence=pathlib.Path(os.environ['RUNNER_TEMP'])/'linux-cold-evidence'\n(evidence/'diagnostic-modules.json').write_text(json.dumps(manifest,indent=2)+'\\n')\nPY\n"
        },
        {
          "uses": "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6",
          "with": {
            "bun-version": "1.4.3"
          }
        },
        {
          "name": "Install frozen dependencies",
          "shell": "bash",
          "run": "set -euo pipefail\nbun -e 'const [major, minor] = Bun.version.split(\".\").map(Number); if (major < 1 || (major === 1 && minor < 4)) throw new Error(`Bun >=1.4 required, got ${Bun.version}`)'\nbun -e 'import { createHash } from \"node:crypto\"; import { realpath } from \"node:fs/promises\"; if (Bun.version !== \"1.4.3\") throw new Error(\"Bun identity mismatch\"); const executable=await realpath(process.execPath); await Bun.write(process.env.RUNNER_TEMP + \"/linux-cold-evidence/bun-identity.json\", JSON.stringify({version:Bun.version,path:executable,sha256:createHash(\"sha256\").update(new Uint8Array(await Bun.file(executable).arrayBuffer())).digest(\"hex\")},null,2) + \"\\n\");'\nbun install --frozen-lockfile\n"
        },
        {
          "name": "Build extension and check committed embedded assets",
          "shell": "bash",
          "run": "set -euo pipefail\nbun run --cwd packages/browser-relay build\ngit diff --exit-code -- packages/coding-agent/src/tools/browser/relay/extension-assets\n"
        },
        {
          "name": "Build Linux test and Windows baseline native addons",
          "shell": "bash",
          "run": "set -euo pipefail\ntest ! -e packages/natives/native/pi_natives.linux-x64-baseline.node\ntest ! -e packages/natives/native/pi_natives.win32-x64-baseline.node\nbun scripts/bazel-natives.ts linux-x64-baseline win32-x64-baseline --dest packages/natives/native -- --jobs=2\ntest -s packages/natives/native/pi_natives.linux-x64-baseline.node\ntest -s packages/natives/native/pi_natives.win32-x64-baseline.node\nsha256sum packages/natives/native/pi_natives.linux-x64-baseline.node packages/natives/native/pi_natives.win32-x64-baseline.node > \"$RUNNER_TEMP/linux-cold-evidence/native-sha256.txt\"\n"
        },
        {
          "name": "Typecheck CLI and extension",
          "shell": "bash",
          "run": "set -euo pipefail\nbun --cwd=packages/coding-agent run check:types\nbun --cwd=packages/browser-relay run check:types\n"
        },
        {
          "name": "Run original cold-first browser and regression commands",
          "shell": "bash",
          "working-directory": "packages/coding-agent",
          "run": "bash \"$RUNNER_TEMP/linux-cold-tools/run_cold_browser.sh\" \"$RUNNER_TEMP/linux-cold-evidence\" \"$RUNNER_TEMP/linux-cold-tools\"\n"
        },
        {
          "name": "Record final source identity and evidence hashes",
          "id": "safe_evidence",
          "if": "always()",
          "shell": "bash",
          "run": "python3 - <<'PY'\nimport hashlib,json,os,pathlib,subprocess\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'linux-cold-evidence'\nroot.mkdir(exist_ok=True)\nassert root.is_dir() and not root.is_symlink()\ndiff=subprocess.run(['git','diff','HEAD','--exit-code','--name-only'],capture_output=True,text=True)\nidentity={'sourceSha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'trackedDiff':diff.stdout.splitlines(),'diffExitCode':diff.returncode,'diagnosticOnly':True,'actualAcceptancePassed':False}\n(root/'source-after.json').write_text(json.dumps(identity,indent=2)+'\\n')\nassert identity['sourceSha']=='254a5b34fa36f31795c8529249275372b86713c5' and identity['diffExitCode']==0 and not identity['trackedDiff']\nallowed={'bun-identity.json','source.json','source-after.json','native-sha256.txt','diagnostic-modules.json','host-samples.jsonl','collector.stdout.log','collector.stderr.log','collector-exit-code.txt','collector.stop','original-start.json','original-finish.json','original-exit-code.txt','browser-tests.log','selected-browser-metadata.json','metadata.stdout.log','metadata.stderr.log','metadata-exit-code.txt'}\nassert {p.name for p in root.iterdir()} <= allowed\nrows=[]\nfor p in sorted(root.iterdir()):\n assert p.is_file() and not p.is_symlink()\n assert p.stat().st_size <= (128*1024*1024 if p.name=='browser-tests.log' else 8*1024*1024),p.name\n rows.append(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name)\n(root/'SHA256SUMS').write_text('\\n'.join(rows)+'\\n')\nPY\n"
        },
        {
          "name": "Preserve bounded diagnostic evidence including failure",
          "if": "always() && steps.safe_evidence.outcome == 'success'",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "omp-linux-cold-254a-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/linux-cold-evidence",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
