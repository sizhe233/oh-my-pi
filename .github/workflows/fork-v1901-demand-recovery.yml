name: OMP v19.0.1 Linux demand recovery validation only
on:
  push:
    branches: ['diagnostics/omp-v19.0.1-demand-recovery']
permissions:
  contents: read
jobs:
  linux-demand-check:
    name: Real Linux Chrome focus and original full TypeScript gate commands
    if: github.repository == 'sizhe233/oh-my-pi'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      OMP_TEST_TIMEOUT: "120"
      PINNED_BASE: 5b48d435a42b581a87c7e9d8d7b8c75d3329b805
      TEST_SOURCE: packages/coding-agent/test/tools/browser-relay-tab-isolation.test.ts
      ORIGINAL_BLOB: 0b94a0edd6a3b9df39fd5e17f68f99e3d5c6fcfb
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Prove exact pinned base, reviewed payload and unchanged real menu regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$PINNED_BASE"
          test "$(git hash-object "$TEST_SOURCE")" = "$ORIGINAL_BLOB"
          test "$(uname -m)" = x86_64
          cat > "$RUNNER_TEMP/expected-diff" <<'FILES'
          .github/workflows/fork-v1901-demand-recovery.yml
          packages/coding-agent/CHANGELOG.md
          packages/coding-agent/src/tools/browser/attach.ts
          packages/coding-agent/src/tools/browser/relay/bridge.ts
          packages/coding-agent/src/tools/browser/tab-supervisor.ts
          packages/coding-agent/test/tools/browser-attach.test.ts
          packages/coding-agent/test/tools/browser-relay-bridge.test.ts
          FILES
          git diff --name-only "$PINNED_BASE" HEAD | diff - "$RUNNER_TEMP/expected-diff"
          test "$(git hash-object packages/coding-agent/CHANGELOG.md)" = 708dbeaf42f39c579705fe47fc7a61b97b5e72b5
          test "$(git hash-object packages/coding-agent/src/tools/browser/attach.ts)" = d914b361428ca260b0bd3d59d7cd73215470f42f
          test "$(git hash-object packages/coding-agent/src/tools/browser/relay/bridge.ts)" = 504e2fbbcb573b1abb7aacf6530787e9f5dfccf9
          test "$(git hash-object packages/coding-agent/src/tools/browser/tab-supervisor.ts)" = 7b3673b913988eba0f9cfa0b937a00c6dce82130
          test "$(git hash-object packages/coding-agent/test/tools/browser-attach.test.ts)" = 6090607d3c675024b1582bdcbdcbb63f084c2a5f
          test "$(git hash-object packages/coding-agent/test/tools/browser-relay-bridge.test.ts)" = 8491419bfc9fac15f10b201284006bb302b840d3
          printf 'Validation of %s over %s. Not formal release acceptance.\n' "$GITHUB_SHA" "$PINNED_BASE"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun -e 'const [major, minor] = Bun.version.split(".").map(Number); if (major < 1 || (major === 1 && minor < 4)) throw new Error(`Bun >=1.4 required, got ${Bun.version}`)'
          bun install --frozen-lockfile
      - name: Build extension and check committed embedded assets
        shell: bash
        run: |
          set -euo pipefail
          bun run --cwd packages/browser-relay build
          git diff --exit-code -- packages/coding-agent/src/tools/browser/relay/extension-assets
      - name: Build Linux test and Windows baseline native addons
        shell: bash
        run: |
          set -euo pipefail
          test ! -e packages/natives/native/pi_natives.linux-x64-baseline.node
          test ! -e packages/natives/native/pi_natives.win32-x64-baseline.node
          bun scripts/bazel-natives.ts linux-x64-baseline win32-x64-baseline --dest packages/natives/native -- --jobs=2
          test -s packages/natives/native/pi_natives.linux-x64-baseline.node
          test -s packages/natives/native/pi_natives.win32-x64-baseline.node
      - name: Typecheck CLI and extension
        shell: bash
        run: |
          set -euo pipefail
          bun --cwd=packages/coding-agent run check:types
          bun --cwd=packages/browser-relay run check:types
      - name: Install Puppeteer's pinned Chrome for Testing for Linux tests
        id: linux-chrome
        shell: bash
        run: |
          set -euo pipefail
          bun --eval '
            import { Browser, install } from "@puppeteer/browsers";
            import { PUPPETEER_REVISIONS } from "puppeteer-core";
            import { appendFile } from "node:fs/promises";
            import { isAbsolute, join } from "node:path";
            const revision = PUPPETEER_REVISIONS.chrome;
            if (revision !== "150.0.7871.24") throw new Error("Unexpected locked Puppeteer Chrome version: " + revision);
            const { RUNNER_TEMP, GITHUB_OUTPUT } = process.env;
            if (!RUNNER_TEMP || !GITHUB_OUTPUT) throw new Error("Missing GitHub runner paths");
            const result = await install({
              browser: Browser.CHROME,
              buildId: revision,
              cacheDir: join(RUNNER_TEMP, "omp-linux-test-browser"),
              baseUrl: "https://storage.googleapis.com/chrome-for-testing-public",
            });
            if (!isAbsolute(result.executablePath) || /[\r\n]/.test(result.executablePath)) {
              throw new Error("Invalid installed Chrome executable path");
            }
            console.log(JSON.stringify({ revision, executablePath: result.executablePath }));
            await appendFile(GITHUB_OUTPUT, "executable=" + result.executablePath + "\nrevision=" + revision + "\n");
          '
      - name: Run original focused Linux browser and restore sequences
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.linux-chrome.outputs.executable }}
        working-directory: packages/coding-agent
        shell: bash
        run: |
          set -euo pipefail
          test -f "${PUPPETEER_EXECUTABLE_PATH:?Missing pinned Chrome executable}"
          test -x "$PUPPETEER_EXECUTABLE_PATH"
          bun test --timeout="$((OMP_TEST_TIMEOUT * 1000))" \
            test/tools/browser-*.test.ts \
            test/utils/image-resize.test.ts \
            test/utils/clipboard.test.ts 2>&1 | tee "$RUNNER_TEMP/omp-focused-browser.log"
          grep -F '(pass) relay tab ownership > does not change either fixture extension menu when the relay borrows a tab' "$RUNNER_TEMP/omp-focused-browser.log"
          grep -F '(pass) relay tab ownership > reads the ordinary same borrowed target without reload or focus when Chrome never refused it' "$RUNNER_TEMP/omp-focused-browser.log"
          bun test --timeout="$((OMP_TEST_TIMEOUT * 1000))" \
            test/task/restore-regressions.test.ts \
            test/task/restore.test.ts \
            test/task/restore-revive.test.ts \
            test/agent-session-restore.test.ts \
            test/async-job-manager.test.ts \
            test/registry/agent-lifecycle.test.ts \
            test/session/yield-queue.test.ts \
            test/session-exit-diagnostics.test.ts \
            test/tools/yield.test.ts \
            test/settings-stream-fn.test.ts \
            ../agent/test/tokenizer.test.ts \
            ../catalog/test/build.test.ts \
            ../catalog/test/generated-policies.test.ts \
            ../catalog/test/model-thinking.test.ts \
            ../catalog/test/compat-cascade.test.ts \
            ../catalog/test/published-effort-ladders.test.ts
      - name: Run original unsharded Linux TypeScript full sequence
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.linux-chrome.outputs.executable }}
        shell: bash
        run: |
          set -euo pipefail
          bun run gen:export-viewer --check
          bun run ci:test:ts
      - name: Record pinned Linux browser version after validation
        if: ${{ always() && steps.linux-chrome.outcome == 'success' }}
        shell: bash
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.linux-chrome.outputs.executable }}
          PINNED_CHROME_REVISION: ${{ steps.linux-chrome.outputs.revision }}
        run: |
          set -euo pipefail
          bun --eval '
            import { execFileSync } from "node:child_process";
            const executablePath = process.env.PUPPETEER_EXECUTABLE_PATH;
            const revision = process.env.PINNED_CHROME_REVISION;
            if (!executablePath || !revision) throw new Error("Missing pinned Chrome installation outputs");
            const version = execFileSync(executablePath, ["--version"], { encoding: "utf8" }).trim();
            console.log(JSON.stringify({ revision, executablePath, version }));
            if (version.split(/\s+/).at(-1) !== revision) throw new Error("Chrome revision mismatch");
          '
